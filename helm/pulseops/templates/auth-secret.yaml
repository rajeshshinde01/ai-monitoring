{{- if not .Values.auth.existingSecret }}
{{- $name := include "pulseops.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.sessionSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.auth.sessionSecretKey }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
