{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pulseops.fullname" . }}-readonly
  namespace: {{ include "pulseops.monitoredNamespace" . }}
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pulseops.fullname" . }}-readonly
  namespace: {{ include "pulseops.monitoredNamespace" . }}
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pulseops.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pulseops.fullname" . }}-readonly
{{- end }}
